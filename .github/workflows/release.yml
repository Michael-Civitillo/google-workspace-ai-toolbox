name: Release builds

# Builds the single-file executables for Windows, macOS and Linux and smoke-tests
# each one on its own OS; builds the Docker image and probes a running container;
# then publishes the executables as a GitHub release.
#
# Two ways to publish, both of which release the version in package.json:
#   - Actions tab -> Release builds -> Run workflow, on the default branch, with
#     "Publish" ticked. No git needed; the v<version> tag is created for you.
#   - Push a v<version> tag.
# Everything else (pull requests, a run without the box ticked) builds and tests
# without publishing.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build as a release, tagged v + the version in package.json"
        type: boolean
        default: false

# Least privilege by default: every job gets a read-only GITHUB_TOKEN. The
# publish job re-grants `contents: write` for itself, so a compromised build
# step (a dependency's install script, say) cannot push tags or releases.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Nothing here drives a browser; skip the ~150 MB Chromium download.
  PUPPETEER_SKIP_DOWNLOAD: "1"

jobs:
  # Fast feedback on a cheap runner, and the gate for the slower OS builds:
  # identical launcher, identical payload, only the runtime differs.
  linux:
    name: Linux x64 (lint, unit tests, build, smoke test)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The executables carry the package.json version (the Windows one in its
      # file properties), so that is the only version a release can truthfully
      # be called. Checked here, in the first job, so a mismatch costs seconds
      # rather than a full build on three operating systems.
      - name: Work out the release tag
        id: version
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "package.json says this is $tag"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME was pushed, but package.json is $tag. Bump \"version\" in package.json to match before tagging."
            exit 1
          fi
          if [ "$PUBLISH" = "true" ]; then
            if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "::error::Releases are published from $DEFAULT_BRANCH. This run is on $GITHUB_REF_NAME; run it again there, or leave Publish unticked to only build and test."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::$tag has already been released. Bump \"version\" in package.json, merge that, and run this again."
              exit 1
            fi
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run test:launcher
      - run: npm run package
      - run: npm run package:bin
      - run: npm run package:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: open-admin-linux-x64
          path: |
            packaging/dist/open-admin-linux-x64
            packaging/dist/open-admin-linux-x64.sha256
          if-no-files-found: error

  macos:
    name: macOS arm64 (build, smoke test)
    runs-on: macos-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm run package:bin
      - run: npm run package:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: open-admin-macos-arm64
          path: |
            packaging/dist/open-admin-macos-arm64
            packaging/dist/open-admin-macos-arm64.sha256
          if-no-files-found: error

  windows:
    name: Windows x64 (build, smoke test)
    runs-on: windows-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm run package:exe
      - name: Check the executable was assembled correctly
        shell: pwsh
        run: |
          $exe = "packaging/dist/OpenAdmin-win-x64.exe"
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "size: $size MB"
          if ($size -gt 150) { throw "executable is $size MB, larger than expected" }
          # A broken signature is worse than none: postject appends a section,
          # which invalidates whatever the runtime shipped with.
          $sig = (Get-AuthenticodeSignature $exe).Status
          Write-Host "signature status: $sig"
          if ($sig -eq 'HashMismatch') { throw "executable carries an invalid signature" }
          Write-Host "product version: $((Get-Item $exe).VersionInfo.ProductVersion)"
      - run: npm run package:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAdmin-win-x64
          path: |
            packaging/dist/OpenAdmin-win-x64.exe
            packaging/dist/OpenAdmin-win-x64.exe.sha256
          if-no-files-found: error

  docker:
    name: Docker image (build, probe a container, validate the Compose file)
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t open-admin:ci .
      - name: Start a container the way the README does and probe it
        run: |
          set -euo pipefail
          docker run -d --name oa -p 3000:3000 -e APP_PASSWORD=ci-password-123456 open-admin:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/login && break
            sleep 1
          done
          post() { curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' "$@" \
                   -d '{"password":"ci-password-123456"}' http://localhost:3000/api/auth/login; }
          echo "login page:        $(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login) (expect 200)"
          echo "login, localhost:  $(post -H 'origin: http://localhost:3000') (expect 200: 0.0.0.0 bind, loopback origin)"
          echo "login, foreign:    $(post -H 'origin: https://evil.example') (expect 403)"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = 200 ]
          [ "$(post -H 'origin: http://localhost:3000')" = 200 ]
          [ "$(post -H 'origin: https://evil.example')" = 403 ]
          echo "runs as: $(docker exec oa id -un) (expect node)"
          [ "$(docker exec oa id -un)" = node ]
          docker exec oa test -d /data
      - name: Show container logs
        if: always()
        run: docker logs oa || true
      - name: Validate the Cloudflare Tunnel Compose file
        working-directory: deploy/cloudflare-tunnel
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^PUBLIC_HOSTNAME=.*/PUBLIC_HOSTNAME=admin.example.com/; s/^APP_PASSWORD=.*/APP_PASSWORD=ci-password-123456/; s/^APP_SESSION_SECRET=.*/APP_SESSION_SECRET=ci-secret/; s/^CLOUDFLARE_TUNNEL_TOKEN=.*/CLOUDFLARE_TUNNEL_TOKEN=ci-token/' .env
          docker compose config > /dev/null
          docker compose config | grep -q 'APP_ALLOWED_ORIGINS: https://admin.example.com'
          # The app must not publish a port: the tunnel is the only way in.
          ! docker compose config | grep -q 'published:'

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [linux, macos, windows, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      # The people this release is for are Workspace admins, not developers:
      # the page opens with what to click, and the generated list of merged
      # changes follows it.
      - name: Write the download instructions
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## Windows: download, double-click, done

          1. Download **OpenAdmin-win-x64.exe** from **Assets** at the bottom of this page.
          2. Double-click it. There is nothing to install, and you don't need administrator rights.
          3. If Windows says **"Windows protected your PC"**, click **More info**, then **Run anyway**. The file isn't code-signed yet, so Windows doesn't recognise it.
          4. A black window opens and asks you to choose a password (12 characters or more). Type it, press Enter, and type it once more to confirm.
          5. Your browser opens. Sign in with that password.

          Leave the black window open while you work, and close it when you're finished. Next time, double-click the same file: your settings are kept.

          EOF
          {
            echo "**macOS and Linux:** \`open-admin-macos-arm64\` (Apple silicon) and \`open-admin-linux-x64\` are in the same list. Each needs two commands in a terminal, shown in the [README](https://github.com/$GITHUB_REPOSITORY#single-file-download-and-run)."
            echo
            echo "**Checking the download:** the SHA-256 of \`OpenAdmin-win-x64.exe\` is \`$(cut -d' ' -f1 dist/OpenAdmin-win-x64.exe.sha256)\`. Every file has a \`.sha256\` beside it."
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          # On a tag push this is the tag that was pushed (checked against
          # package.json in the first job). On a run from the Actions tab the
          # tag doesn't exist yet and is created at the commit that was built.
          tag_name: ${{ needs.linux.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Open Admin ${{ needs.linux.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: notes.md
          generate_release_notes: true
