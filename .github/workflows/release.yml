name: Release builds

# Builds the single-file executables for Windows, macOS and Linux and smoke-tests
# each one on its own OS; builds the Docker image and probes a running container;
# then publishes the executables as a GitHub release.
#
# Two ways to publish, both of which release the version in package.json:
#   - Actions tab -> Release builds -> Run workflow, on the default branch, with
#     "Publish" ticked. No git needed; the v<version> tag is created for you.
#   - Push a v<version> tag, on a commit that is on the default branch.
# Everything else (pull requests, a run without the box ticked - even one
# started from a tag) builds and tests without publishing. A version that has
# already been released is never published again.
#
# Third-party actions are pinned by commit, with the release in a comment.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build as a release, tagged v + the version in package.json"
        type: boolean
        default: false

# Least privilege by default: every job gets a read-only GITHUB_TOKEN. The
# publish job re-grants `contents: write` for itself, so a compromised build
# step (a dependency's install script, say) cannot push tags or releases.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Nothing here drives a browser; skip the ~150 MB Chromium download.
  PUPPETEER_SKIP_DOWNLOAD: "1"

jobs:
  # Fast feedback on a cheap runner, and the gate for the slower OS builds:
  # identical launcher, identical payload, only the runtime differs.
  linux:
    name: Linux x64 (lint, unit tests, build, smoke test)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, so a pushed tag can be checked against the
          # default branch.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.5"
          cache: npm
      # The executables carry the package.json version (the Windows one in its
      # file properties), so that is the only version a release can truthfully
      # be called. Checked here, in the first job, so a run that must not
      # publish stops in seconds rather than after a build on three systems.
      - name: Decide whether this run publishes, and check that it may
        id: version
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH_TICKED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "package.json says this is $tag"

          # Exactly two kinds of run publish: a pushed v* tag, and a run from
          # the Actions tab with Publish ticked.
          publish=false
          if [ "$EVENT" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            publish=true
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME was pushed, but package.json is $tag. Bump \"version\" in package.json to match before tagging."
              exit 1
            fi
            # Releases are built from the default branch, never from a commit
            # only a tag points at.
            git fetch --no-tags --quiet origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
              echo "::error::Tag $GITHUB_REF_NAME is on a commit that is not on $DEFAULT_BRANCH. Merge the change into $DEFAULT_BRANCH and tag a commit there."
              exit 1
            fi
          elif [ "${PUBLISH_TICKED:-false}" = true ]; then
            publish=true
            if [ "$GITHUB_REF_TYPE" != branch ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "::error::Releases are published from $DEFAULT_BRANCH. This run is on $GITHUB_REF_NAME; run it again there, or leave Publish unticked to only build and test."
              exit 1
            fi
            # The tag is created when the release is published: it must not exist yet.
            # git ls-remote --exit-code: 0 found, 2 not found, anything else failed.
            found=0
            git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || found=$?
            if [ "$found" -eq 0 ]; then
              echo "::error::$tag already exists. Bump \"version\" in package.json, merge that, and run this again."
              exit 1
            elif [ "$found" -ne 2 ]; then
              echo "::error::Could not check whether $tag already exists (git ls-remote exited with $found). Run this again."
              exit 1
            fi
          fi

          # Never publish over a release: re-pushing a tag stops here.
          if [ "$publish" = true ]; then
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")" || true
            if [ "$status" = 200 ]; then
              echo "::error::$tag has already been released. Bump \"version\" in package.json, merge that, and release the new version instead."
              exit 1
            elif [ "$status" != 404 ]; then
              echo "::error::Could not check whether $tag has been released (GitHub answered ${status:-nothing}). Run this again."
              exit 1
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "this run publishes: $publish"
      - run: npm ci
      - run: npm run lint
      - run: npm run test:lib
      - run: npm run test:launcher
      - run: npm run package
      - run: npm run package:bin
      - run: npm run package:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-admin-linux-x64
          path: |
            packaging/dist/open-admin-linux-x64
            packaging/dist/open-admin-linux-x64.sha256
          if-no-files-found: error

  macos:
    name: macOS arm64 (build, smoke test)
    runs-on: macos-latest
    needs: linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.5"
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm run package:bin
      - run: npm run package:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-admin-macos-arm64
          path: |
            packaging/dist/open-admin-macos-arm64
            packaging/dist/open-admin-macos-arm64.sha256
          if-no-files-found: error

  windows:
    name: Windows x64 (build, smoke test)
    runs-on: windows-latest
    needs: linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.5"
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm run package:exe
      - name: Check the executable was assembled correctly
        shell: pwsh
        run: |
          $exe = "packaging/dist/OpenAdmin-win-x64.exe"
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "size: $size MB"
          if ($size -gt 150) { throw "executable is $size MB, larger than expected" }
          # A broken signature is worse than none: postject appends a section,
          # which invalidates whatever the runtime shipped with.
          $sig = (Get-AuthenticodeSignature $exe).Status
          Write-Host "signature status: $sig"
          if ($sig -eq 'HashMismatch') { throw "executable carries an invalid signature" }
          Write-Host "product version: $((Get-Item $exe).VersionInfo.ProductVersion)"
      - run: npm run package:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenAdmin-win-x64
          path: |
            packaging/dist/OpenAdmin-win-x64.exe
            packaging/dist/OpenAdmin-win-x64.exe.sha256
          if-no-files-found: error

  docker:
    name: Docker image (build, probe a container, validate the Compose file)
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build from a checkout made under a strict umask
        # Someone building their own image may have umask 077, which leaves
        # every file in the checkout closed to all but its owner. The image
        # must still work: its code is owned by root and run by "node". The
        # probes below (the public file, the health check) fail if it doesn't.
        run: |
          chmod -R go-rwx .
          docker build -t open-admin:ci .
      - name: Start a container the way the README does and probe it
        run: |
          set -euo pipefail
          docker run -d --name oa -p 3000:3000 -e APP_PASSWORD=ci-password-123456 open-admin:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/login && break
            sleep 1
          done
          post() { curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' "$@" \
                   -d '{"password":"ci-password-123456"}' http://localhost:3000/api/auth/login; }
          echo "login page:        $(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login) (expect 200)"
          echo "login, localhost:  $(post -H 'origin: http://localhost:3000') (expect 200: 0.0.0.0 bind, loopback origin)"
          echo "login, foreign:    $(post -H 'origin: https://evil.example') (expect 403)"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = 200 ]
          echo "public file:       $(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/logo.svg) (expect 200: readable by the server's user)"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/logo.svg)" = 200 ]
          [ "$(post -H 'origin: http://localhost:3000')" = 200 ]
          [ "$(post -H 'origin: https://evil.example')" = 403 ]
          echo "runs as: $(docker exec oa id -un) (expect node)"
          [ "$(docker exec oa id -un)" = node ]
          docker exec oa test -d /data
          # The server may write its state, never its own code.
          code_writable="$(docker exec oa sh -c 'if test -w /app || test -w /app/server.js || test -w /app/.next/server; then echo yes; else echo no; fi')"
          echo "code writable by the server: $code_writable (expect no)"
          [ "$code_writable" = no ]
          docker exec oa test -w /data
          docker exec oa node /usr/local/lib/open-admin/healthcheck.mjs
      - name: Check the health check follows PORT and reports a misconfigured container
        run: |
          set -euo pipefail
          docker run -d --name oa-port -p 3002:8080 -e PORT=8080 -e APP_PASSWORD=ci-password-123456 open-admin:ci
          docker run -d --name oa-bad -p 3001:3000 open-admin:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3002/login && curl -s -o /dev/null http://localhost:3001/login && break
            sleep 1
          done
          docker exec oa-port node /usr/local/lib/open-admin/healthcheck.mjs
          # No APP_PASSWORD: the app refuses to serve, so it must not count as healthy.
          if docker exec oa-bad node /usr/local/lib/open-admin/healthcheck.mjs; then
            echo "::error::the health check passed for a container without APP_PASSWORD"
            exit 1
          fi
          docker rm -f oa-port oa-bad
      - name: Show container logs
        if: always()
        run: docker logs oa || true
      - name: Validate the Cloudflare Tunnel Compose file
        working-directory: deploy/cloudflare-tunnel
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^PUBLIC_HOSTNAME=.*/PUBLIC_HOSTNAME=admin.example.com/; s/^APP_PASSWORD=.*/APP_PASSWORD=ci-password-123456/; s/^APP_SESSION_SECRET=.*/APP_SESSION_SECRET=ci-secret/; s/^CLOUDFLARE_TUNNEL_TOKEN=.*/CLOUDFLARE_TUNNEL_TOKEN=ci-token/' .env
          docker compose config > /dev/null
          docker compose config | grep -q 'APP_ALLOWED_ORIGINS: https://admin.example.com'
          # The app must not publish a port: the tunnel is the only way in.
          ! docker compose config | grep -q 'published:'

  release:
    name: Publish the release
    # A pushed v* tag, or a run from the Actions tab with Publish ticked - the
    # event decides, not the ref: a manual run started from a tag with Publish
    # unticked must not publish - and only once the first job has found that
    # this version may be published.
    if: >-
      needs.linux.outputs.publish == 'true' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [linux, macos, windows, docker]
    runs-on: ubuntu-latest
    # One publish per version at a time, so two runs for the same version
    # cannot both pass the check below and then overwrite each other.
    concurrency:
      group: publish-${{ needs.linux.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # The first job checked this before the builds; check again now that
      # this job is the only one publishing this version.
      - name: Make sure this version is still unpublished
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.linux.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          status() {
            curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$1" || true
          }
          release="$(status "releases/tags/$TAG")"
          if [ "$release" = 200 ]; then
            echo "::error::$TAG has been released already, by another run. Nothing is published."
            exit 1
          elif [ "$release" != 404 ]; then
            echo "::error::Could not check whether $TAG has been released (GitHub answered ${release:-nothing})."
            exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="$(status "git/ref/tags/$TAG")"
            if [ "$tag" = 200 ]; then
              echo "::error::The tag $TAG was created by someone else while this run was building. Nothing is published."
              exit 1
            elif [ "$tag" != 404 ]; then
              echo "::error::Could not check whether the tag $TAG exists (GitHub answered ${tag:-nothing})."
              exit 1
            fi
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      # The people this release is for are Workspace admins, not developers:
      # the page opens with what to click, and the generated list of merged
      # changes follows it.
      - name: Write the download instructions
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## Windows: download, double-click, done

          1. Download **OpenAdmin-win-x64.exe** from **Assets** at the bottom of this page.
          2. Double-click it. There is nothing to install, and you don't need administrator rights.
          3. If Windows says **"Windows protected your PC"**, click **More info**, then **Run anyway**. The file isn't code-signed yet, so Windows doesn't recognise it.
          4. A black window opens and, a few seconds later, so does your browser, already signed in. There is no password to choose.

          Leave the black window open while you work, and close it when you're finished. Next time, double-click the same file: your settings are kept.

          EOF
          {
            echo "**macOS and Linux:** \`open-admin-macos-arm64\` (Apple silicon) and \`open-admin-linux-x64\` are in the same list. Each needs two commands in a terminal, shown in the [README](https://github.com/$GITHUB_REPOSITORY#single-file-download-and-run)."
            echo
            echo "**Checking the download:** the SHA-256 of \`OpenAdmin-win-x64.exe\` is \`$(cut -d' ' -f1 dist/OpenAdmin-win-x64.exe.sha256)\`. Every file has a \`.sha256\` beside it."
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # On a tag push this is the tag that was pushed (checked against
          # package.json in the first job). On a run from the Actions tab the
          # tag doesn't exist yet and is created at the commit that was built.
          tag_name: ${{ needs.linux.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Open Admin ${{ needs.linux.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: notes.md
          generate_release_notes: true
