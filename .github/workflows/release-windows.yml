name: Single-file build

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Nothing here drives a browser; skip the ~150 MB Chromium download.
  PUPPETEER_SKIP_DOWNLOAD: "1"

jobs:
  # Fast feedback on a cheap runner: identical launcher, identical payload,
  # only the runtime it is injected into differs.
  linux:
    name: Lint, test and smoke-test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:launcher
      - run: npm run package
      - run: npm run package:bin
      - run: npm run package:smoke

  windows:
    name: Build and smoke-test the Windows executable
    runs-on: windows-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm run package:exe
      - name: Check the executable was assembled correctly
        shell: pwsh
        run: |
          $exe = "packaging/dist/OpenAdmin-win-x64.exe"
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "size: $size MB"
          if ($size -gt 150) { throw "executable is $size MB, larger than expected" }
          # A broken signature is worse than none: postject appends a section,
          # which invalidates whatever the runtime shipped with.
          $sig = (Get-AuthenticodeSignature $exe).Status
          Write-Host "signature status: $sig"
          if ($sig -eq 'HashMismatch') { throw "executable carries an invalid signature" }
          Write-Host "product version: $((Get-Item $exe).VersionInfo.ProductVersion)"
      - run: npm run package:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAdmin-win-x64
          path: |
            packaging/dist/OpenAdmin-win-x64.exe
            packaging/dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/dist/OpenAdmin-win-x64.exe
            packaging/dist/SHA256SUMS.txt
          generate_release_notes: true
